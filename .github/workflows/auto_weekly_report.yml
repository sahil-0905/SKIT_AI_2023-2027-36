name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST = 18:29 UTC
    - cron: "29 18 * * 4"

  # Manual trigger from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple report workflows from pushing to main simultaneously
concurrency:
  group: weekly-progress-report
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      # --------------------------------------------------
      # 4. Generate weekly PDF
      # --------------------------------------------------
      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      # --------------------------------------------------
      # 5. Move PDF, commit and push
      # --------------------------------------------------
      - name: Move PDF to Weekly Reports Directory & Commit
        shell: bash
        run: |
          set -e

          echo "📁 Creating weekly_reports directory..."
          mkdir -p weekly_reports

          echo "📄 Moving generated PDF..."
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

          echo "🔧 Configuring Git..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "➕ Adding report to Git..."
          git add weekly_reports/

          # ------------------------------------------------
          # Check whether there is anything to commit
          # ------------------------------------------------
          if git diff --staged --quiet; then
            echo "ℹ️ No new changes or reports to commit."
            exit 0
          fi

          echo "💾 Creating commit..."
          git commit -m "docs: archive Form-3 weekly progress report [skip ci]"

          # ------------------------------------------------
          # Synchronize with latest remote main
          # ------------------------------------------------
          echo "🔄 Fetching latest main branch..."
          git fetch origin main

          echo "🔀 Rebasing local commit on latest main..."
          git rebase origin/main

          # ------------------------------------------------
          # Push with retry mechanism
          # ------------------------------------------------
          echo "🚀 Pushing report to GitHub..."

          for attempt in 1 2 3
          do
            echo "Push attempt $attempt..."

            if git push origin main; then
              echo "✅ Report successfully pushed to main."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Push failed after 3 attempts."
              exit 1
            fi

            echo "⚠️ Push failed. Updating from remote before retry..."

            git fetch origin main
            git rebase origin/main
          done
